<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>HTML演示工具集 - Oscar Studio</title>
    <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
    <script>LA.init({ id: "3ObWyMneL7EkDfrL", ck: "3ObWyMneL7EkDfrL" })</script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Top Bar -->
    <header class="top-bar">
        <div class="breadcrumb"><img src="logo.png" alt="" style="height:24px;vertical-align:middle;margin-right:8px;">Oscar Studio > <span>HTML-PPT</span></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索">
        </div>
        <div id="userButtonContainer"></div>
        <button class="settings-btn" id="settingsBtn">⚙</button>
        <div class="settings-dropdown" id="settingsDropdown">
            <h4>画质设置</h4>
            <label class="settings-option">
                <input type="radio" name="quality" value="low">
                <span class="radio"></span>
                <span>低（去除动画）</span>
            </label>
            <label class="settings-option">
                <input type="radio" name="quality" value="normal" checked>
                <span class="radio"></span>
                <span>正常</span>
            </label>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-icon">📑</div>
        <h1>HTML演示工具集</h1>
        <p>使用 HTML 制作的演示工具集，涵盖多种场景应用。所有工具直接在浏览器中运行，无需安装，方便快捷。</p>
    </section>

    <!-- Card Container -->
    <main class="card-container" id="cardContainer"></main>

    <!-- Backdrop -->
    <div class="backdrop" id="backdrop"></div>

    <script src="https://ai.oscarstudio.cn/opilot.js"></script>
    <link rel="stylesheet" href="https://ai.oscarstudio.cn/opilot.css">
    <script src="script.js"></script>
    <script src="https://ai.oscarstudio.cn/user-button.js"></script>
</body>
</html>
